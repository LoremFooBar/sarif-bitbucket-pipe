name: Sarif Report
image: loremfoobar/sarif-bitbucket-pipe:0.1.1
description: Generate pipeline report and a build status based on SARIF file
category: Code Quality
repository: https://bitbucket.org/loremfoobar/sarif-bitbucket-pipe
maintainer:
  name: LoremFooBar
  website: "https://github.com/LoremFooBar"
tags:
  - bitbucket-pipelines
  - sarif
  - static-analysis
  - code-insights
variables:
  - name: SARIF_FILE_PATH
  - name: ACCOUNT_EMAIL
  - name: API_TOKEN
  - name: CREATE_BUILD_STATUS
    default: "true"
  - name: FAIL_WHEN_ISSUES_FOUND
    default: "false"
  - name: INCLUDE_ONLY_ISSUES_IN_DIFF
    default: "false"
  - name: DEBUG
    default: "false"
